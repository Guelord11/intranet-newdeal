name: CI - Dev Branch

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: intranet-newdeal
  IMAGE_TAG: dev-${{ github.sha }}
  DOCKER_REGISTRY: docker.io
  DOCKER_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal

jobs:

  build_image:
    name: Build Docker image (nginx:alpine3.23-slim)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Display image metadata
        run: |
          echo "IMAGE_NAME: $IMAGE_NAME"
          echo "IMAGE_TAG: $IMAGE_TAG"
          echo "DOCKER_REPOSITORY: $DOCKER_REPOSITORY"

      - name: Build image
        run: |
          docker build -t $DOCKER_REPOSITORY:$IMAGE_TAG .

      - name: Save image artifact
        run: |
          docker save $DOCKER_REPOSITORY:$IMAGE_TAG -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  security_scan:
    name: Security scan (vulnerabilities + secrets)
    runs-on: ubuntu-latest
    needs: build_image

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Scan repository secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for CRITICAL vulnerabilities (block pipeline)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Scan image for HIGH/CRITICAL report
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.DOCKER_REPOSITORY }}:${{ env.IMAGE_TAG }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0

  push_image:
    name: Push image to Docker Hub
    runs-on: ubuntu-latest
    needs: security_scan

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push version tag
        run: docker push $DOCKER_REPOSITORY:$IMAGE_TAG

      - name: Tag as dev-latest
        run: |
          docker tag $DOCKER_REPOSITORY:$IMAGE_TAG $DOCKER_REPOSITORY:dev-latest
          docker push $DOCKER_REPOSITORY:dev-latest

  notify:
    name: Email notification
    runs-on: ubuntu-latest
    needs:
      - build_image
      - security_scan
      - push_image
    if: always()

    steps:
      - name: Send pipeline email status
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Dev Pipeline] intranet-newdeal - ${{ job.status }}"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            Pipeline: CI - Dev Branch
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}